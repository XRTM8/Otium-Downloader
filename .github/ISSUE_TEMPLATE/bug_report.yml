name: Bug Report
description: Report a reproducible problem or defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **Otium Downloader**.
  - type: input
    id: version
    attributes:
      label: Otium Version
      description: What version are you running? (e.g. v1.2.0)
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu/Debian/Arch/Fedora)
        - macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Click 'Add Task'
        2. Paste URL '...'
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
