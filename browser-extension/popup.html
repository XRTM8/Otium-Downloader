<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Otium Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    body {
      width: 320px;
      background-color: #08090c;
      color: #f4f4f5;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #00e599 0%, #00b377 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #08090c;
      font-weight: 900;
      font-size: 13px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #71717a;
    }
    .status-dot.online {
      background: #00e599;
      box-shadow: 0 0 8px rgba(0, 229, 153, 0.5);
    }
    .status-dot.offline {
      background: #ef4444;
    }
    .card {
      background: #0e1017;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .switch-label {
      font-size: 12px;
      color: #d4d4d8;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00e599;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: #08090c;
    }
    .input-box {
      width: 100%;
      background: #08090c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 11px;
      font-family: monospace;
      outline: none;
      margin-bottom: 8px;
      transition: border-color .15s;
    }
    .input-box:focus {
      border-color: #00e599;
    }
    .btn {
      width: 100%;
      background: #00e599;
      color: #08090c;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #71717a;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">O</div>
      <div class="title">Otium Downloader</div>
    </div>
    <div class="status-badge" id="statusBadge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">جاري الفحص...</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="switch-label">اعتراض تنزيلات المتصفح تلقائياً</span>
      <label class="switch">
        <input type="checkbox" id="interceptToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <input type="text" id="manualUrl" class="input-box" placeholder="الصق رابطاً أو Magnet هنا للتحميل المباشر..." dir="ltr">
    <button id="sendBtn" class="btn">إرسال للتنزيل بـ Otium ⚡</button>
  </div>

  <div class="footer">
    المنفذ المحلي: 127.0.0.1:41523 • إصدار 1.3.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
